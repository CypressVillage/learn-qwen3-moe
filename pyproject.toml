[project]
name = "learn-qwen3-moe"
version = "0.1.0"
description = "A learning project for implementing Qwen3 MoE inference from first principles."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.11.28,<0.13"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen3_moe"]
